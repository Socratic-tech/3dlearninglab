<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root { --p:#0b5cad; --ps:#e3effb; --ok:#15803d; --oks:#e6f6ec; --w:#a16207; --ws:#fdf6dc; --b:#cfd8e3; --m:#4a5a70; --bg:#f4f7fb; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:#0f1b2d; margin:0; padding:14px; }
  h1 { font-size:17px; margin:0; } h2 { font-size:16px; margin:0 0 6px; } h3 { font-size:14px; margin:0; }
  p { margin:6px 0; }
  a { color:var(--p); font-weight:600; }
  .muted { color:var(--m); font-size:12.5px; }
  .card { border:1px solid var(--b); border-radius:12px; padding:14px; margin:12px 0; }
  .card.hero { border:2px solid var(--p); background:var(--ps); }
  .card.good { border-color:var(--ok); background:var(--oks); }
  .warn { background:var(--ws); border:1px solid var(--w); border-radius:10px; padding:10px 12px; margin:8px 0; }
  button, .btn { display:block; width:100%; box-sizing:border-box; text-align:center; border:0; border-radius:10px; background:var(--p); color:#fff; font-weight:700; padding:11px 14px; font-size:15px; cursor:pointer; text-decoration:none; margin-top:10px; }
  button.secondary, .btn.secondary { background:#fff; color:var(--p); border:2px solid var(--p); padding:9px 12px; }
  button.small { display:inline-block; width:auto; font-size:13px; padding:6px 12px; margin:6px 6px 0 0; }
  button.link { background:none; color:var(--p); padding:4px 0; width:auto; display:inline; font-weight:600; text-decoration:underline; margin:0; }
  button:disabled { opacity:.55; cursor:default; }
  ol { padding-left:20px; margin:8px 0; } li { margin:4px 0; }
  input[type=text], select { width:100%; box-sizing:border-box; border:1px solid var(--b); border-radius:8px; padding:9px; font-size:15px; margin-top:4px; }
  label { display:block; margin-top:10px; font-weight:600; }
  .link { word-break:break-all; background:var(--bg); border-radius:8px; padding:6px 8px; font-size:12px; margin-top:6px; }
  .class { border-top:1px solid var(--b); padding:12px 0 2px; }
  .class:first-of-type { border-top:0; padding-top:0; }
  .qr { margin-top:8px; }
  .progress { display:flex; gap:6px; margin:10px 0 4px; }
  .progress span { flex:1; height:6px; border-radius:3px; background:var(--b); }
  .progress span.on { background:var(--ok); }
  .choices { display:flex; gap:8px; margin-top:6px; }
  .choices label { flex:1; margin:0; border:2px solid var(--b); border-radius:10px; padding:8px; text-align:center; font-weight:600; cursor:pointer; }
  .choices input { position:absolute; opacity:0; }
  .choices label.on { border-color:var(--p); background:var(--ps); }
  .choices small { display:block; font-weight:400; color:var(--m); }
  details { border:1px solid var(--b); border-radius:12px; padding:10px 14px; margin:12px 0; }
  summary { cursor:pointer; font-weight:700; font-size:14.5px; }
  .spin { width:28px; height:28px; border:3px solid var(--ps); border-top-color:var(--p); border-radius:50%; animation:s 0.9s linear infinite; margin:4px auto 10px; }
  @keyframes s { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  .tick { color:var(--ok); font-weight:700; }
  .foot { margin-top:16px; }
  .pic { display:block; width:100%; height:auto; border:1px solid var(--b); border-radius:8px; background:#fff; margin:6px 0 2px; }
  ol.big { padding-left:0; list-style:none; counter-reset:n; }
  ol.big > li { counter-increment:n; margin:14px 0; padding-left:30px; position:relative; }
  ol.big > li::before { content:counter(n); position:absolute; left:0; top:0; width:22px; height:22px; border-radius:50%; background:var(--p); color:#fff; font-weight:700; font-size:12px; display:grid; place-items:center; }
  .waiting { display:flex; align-items:center; gap:8px; color:var(--m); font-size:12.5px; margin-top:8px; }
  .waiting .spin { width:14px; height:14px; border-width:2px; margin:0; flex-shrink:0; }
</style>
</head>
<body>
<h1>3D Design Academy</h1>
<div id="app"><div class="card" style="text-align:center"><div class="spin"></div><p>Loading…</p></div></div>
<p class="muted foot" id="who"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/*
 * One thing at a time:
 *   working  → "Setting up…" (runs by itself right after the teacher allows permissions)
 *   turn on  → the one Deploy Google makes the teacher click, with a picture of each screen
 *   noClass  → "You're set up! Create your first class"
 *   home     → dashboard button, classes with links + QR, add class, settings, updates
 */
var S = null, working = false, showAdd = false, openQr = {};
function $(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function busy(btn, text) { if (btn) { btn.disabled = true; btn.dataset.t = btn.textContent; btn.textContent = text; } }
function run(fn, arg, btn, text) {
  busy(btn, text || "Working…");
  var r = google.script.run
    .withSuccessHandler(function (s) { working = false; S = s; render(); })
    .withFailureHandler(function (e) { working = false; if (S) render(); alertBox(e.message || String(e)); if (btn) { btn.disabled = false; btn.textContent = btn.dataset.t; } });
  arg === undefined ? r[fn]() : r[fn](arg);
}
function alertBox(msg) { var d = document.createElement("div"); d.className = "warn"; d.textContent = msg; $("app").prepend(d); }
function setup(btn) { working = true; render(); run("sidebarAutoSetup", undefined, btn); }

function progress(n) {
  return '<div class="progress" aria-label="Step ' + n + ' of 3">' + [1, 2, 3].map(function (i) { return '<span class="' + (i <= n ? "on" : "") + '"></span>'; }).join("") + "</div>";
}

function render() {
  $("who").textContent = S ? "Signed in as " + S.owner + " · version " + S.version : "";
  var h = "";
  if (working || !S) {
    h = progress(1) + '<div class="card hero" style="text-align:center"><div class="spin"></div><h2>Setting up your Sheet…</h2><p>About 10 seconds. Keep this panel open.</p></div>';
  } else if (!S.ready) {
    h = progress(1) + '<div class="card hero"><h2>Let’s set up your Sheet</h2><p>This takes about 10 seconds.</p><button onclick="setup(this)">Set up my Sheet</button></div>';
  } else if (!S.url) {
    h = progress(1) + turnOnApp();
  } else if (!S.classes.length) {
    h = progress(2) + '<div class="card good"><h2><span class="tick">✓</span> You’re set up!</h2><p>Now make your first class.</p></div>' + classForm("Create your first class");
  } else {
    h = home();
  }
  $("app").innerHTML = h;
  if (S) S.classes.forEach(function (c, i) { if (openQr[i] && c.link && window.QRCode) new QRCode($("qr" + i), { text: c.link, width: 150, height: 150 }); });
  bindChoices();
  poll();
}

function home() {
  var newer = S.latest && S.latest.version && S.latest.version !== S.version;
  var h = "";
  if (!S.safeUpdates && S.pasteUrl) h += '<div class="card hero"><h2>One-time update</h2><p>Paste the new loader once. After that, updates install only when you click <b>Update now</b>, each one is safety-checked first, and you can undo.</p><a class="btn" target="_blank" href="' + esc(S.pasteUrl) + '">Show me how (2 minutes) ↗</a><p class="muted">Your links and student work stay the same.</p></div>';
  else if (newer) h += '<div class="card hero"><h2>Update available</h2>' + (S.latest.notes ? "<p>" + esc(S.latest.notes) + "</p>" : "") + '<button onclick="update(this)">Update now</button><p class="muted">It’s checked before it installs, and you can undo it. Links and student work stay the same.</p><div id="upd"></div></div>';
  if (!S.site) h += '<div class="warn">This copy doesn’t know the website address. Ask whoever shared it for an updated template.</div>';
  if (S.teacherLink) h += '<a class="btn" target="_blank" href="' + esc(S.teacherLink) + '">Open my dashboard ↗</a><p class="muted">See progress, review work and import rosters. Bookmark the page that opens.</p>';

  h += '<div class="card"><h2>Your classes</h2><p class="muted">Post a class’s student link in Google Classroom. Students click it and sign in with Google.</p>';
  S.classes.forEach(function (c, i) {
    h += '<div class="class"><h3>' + esc(c.name) + "</h3>" + (c.link
      ? '<button class="small" onclick="copyText(S.classes[' + i + '].link, this)">Copy student link</button>' +
        '<button class="small secondary" onclick="toggleQr(' + i + ')">' + (openQr[i] ? "Hide QR code" : "Show QR code") + "</button>" +
        (openQr[i] ? '<div class="qr" id="qr' + i + '"></div><p class="muted">Show this on the board for students to scan.</p>' : "")
      : "") + "</div>";
  });
  h += showAdd ? "" : '<p><button class="link" onclick="showAdd=true; render()">+ Add another class</button></p>';
  h += "</div>";
  if (showAdd) h += classForm("Add another class");

  h += "<details><summary>Settings</summary>" +
    '<label>Student email domains<input type="text" id="dom" value="' + esc(S.domains) + '" placeholder="district.org, students.district.org"></label>' +
    '<p class="muted">Who can sign in. Add your students’ domain if it’s different from yours.</p>' +
    '<label style="font-weight:400"><input type="checkbox" id="auto"' + (S.autoEnroll ? " checked" : "") + "> Students join a class just by opening its link</label>" +
    '<p class="muted">Off: only students on your roster get in.</p>' +
    '<label>Co-teachers (emails)<input type="text" id="tch" value="' + esc(S.teacherEmails) + '" placeholder="optional"></label>' +
    '<label>Administrators (emails)<input type="text" id="adm" value="' + esc(S.adminEmails) + '" placeholder="principal, district or RESA staff"></label>' +
    '<button class="secondary" onclick="save(this)">Save settings</button>' +
    (S.teacherLink ? '<p style="margin-top:14px"><b>Staff link</b>: send this to the co-teachers and admins above (not to students).</p><button class="small secondary" onclick="copyText(S.teacherLink, this)">Copy staff link</button>' : "") +
    '<p style="margin-top:14px"><b>App address</b> (only if the website asks for it):</p><div class="link">' + esc(S.url) + "</div>" +
    (S.safeUpdates ? '<p class="muted" style="margin-top:14px">Version ' + esc(S.version) + '. Lessons update by themselves; app updates install when you click Update now.</p>' +
      (S.previousVersion ? '<button class="small secondary" onclick="undo(this)">Undo last update (back to ' + esc(S.previousVersion) + ')</button>' : "") + '<div id="undo"></div>' : "") +
    "</details>";
  return h;
}

function classForm(title) {
  return '<div class="card' + (S.classes.length ? "" : " hero") + '"><h2>' + title + "</h2>" +
    '<label>Class name<input type="text" id="cname" placeholder="3D Design – Period 2"></label>' +
    '<label>How long is the course?</label><div class="choices" id="len">' +
    '<label class="on"><input type="radio" name="len" value="18-week" checked>18 weeks<small>semester</small></label>' +
    '<label><input type="radio" name="len" value="9-week">9 weeks<small>quarter</small></label>' +
    '<label><input type="radio" name="len" value="jr-starter">Grades 4–5<small>starter unit</small></label></div>' +
    '<button onclick="createClass(this)">Create class</button>' +
    (S.classes.length ? '<p><button class="link" onclick="showAdd=false; render()">Cancel</button></p>' : "") + "</div>";
}

function bindChoices() {
  var box = $("len"); if (!box) return;
  box.addEventListener("change", function () {
    Array.prototype.forEach.call(box.querySelectorAll("label"), function (l) { l.className = l.querySelector("input").checked ? "on" : ""; });
  });
}

// Google doesn't let a Sheet copy publish itself, so the teacher clicks Deploy once. Pictures for each screen.
var PIC = {
  deploy: '<svg class="pic" viewBox="0 0 260 92"><rect width="260" height="26" fill="#f1f3f4"/><text x="10" y="17" font-size="10" fill="#5f6368">Apps Script · 3D Design Academy</text><rect x="186" y="4" width="66" height="18" rx="4" fill="#1a73e8"/><text x="219" y="16.5" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Deploy ▾</text><rect x="140" y="30" width="112" height="56" rx="6" fill="#fff" stroke="#dadce0"/><rect x="143" y="34" width="106" height="16" rx="3" fill="#e8f0fe"/><text x="150" y="46" font-size="10" font-weight="700" fill="#202124">New deployment</text><text x="150" y="64" font-size="10" fill="#5f6368">Manage deployments</text><text x="150" y="79" font-size="10" fill="#5f6368">Test deployments</text><rect x="141" y="32" width="110" height="20" rx="4" fill="none" stroke="#c2410c" stroke-width="2"/><rect x="184" y="2" width="70" height="22" rx="6" fill="none" stroke="#c2410c" stroke-width="2"/></svg>',
  type: '<svg class="pic" viewBox="0 0 260 80"><text x="10" y="18" font-size="11" font-weight="700" fill="#202124">New deployment</text><text x="10" y="40" font-size="10" fill="#5f6368">Select type</text><circle cx="80" cy="37" r="7" fill="#e8eaed"/><text x="80" y="41" font-size="10" text-anchor="middle" fill="#5f6368">⚙</text><circle cx="80" cy="37" r="11" fill="none" stroke="#c2410c" stroke-width="2"/><rect x="96" y="28" width="118" height="44" rx="6" fill="#fff" stroke="#dadce0"/><text x="106" y="45" font-size="10" fill="#5f6368">API Executable</text><rect x="99" y="51" width="112" height="17" rx="3" fill="#e8f0fe"/><text x="106" y="63" font-size="10" font-weight="700" fill="#202124">Web app</text><rect x="97" y="49" width="116" height="21" rx="4" fill="none" stroke="#c2410c" stroke-width="2"/></svg>',
  form: '<svg class="pic" viewBox="0 0 260 112"><text x="10" y="18" font-size="10" fill="#5f6368">Execute as</text><rect x="10" y="23" width="150" height="20" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="17" y="37" font-size="10" font-weight="700" fill="#202124">Me (you@school.org)</text><text x="10" y="58" font-size="10" fill="#5f6368">Who has access</text><rect x="10" y="63" width="150" height="20" rx="4" fill="#fff" stroke="#c2410c" stroke-width="2"/><text x="17" y="77" font-size="10" font-weight="700" fill="#202124">Anyone</text><rect x="194" y="86" width="56" height="20" rx="4" fill="#1a73e8"/><text x="222" y="100" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Deploy</text><rect x="191" y="83" width="62" height="26" rx="6" fill="none" stroke="#c2410c" stroke-width="2"/></svg>'
};

function turnOnApp() {
  return '<div class="card good"><h2><span class="tick">✓</span> Your Sheet is ready</h2></div>' +
    '<div class="card hero"><h2>Turn on your app (2 minutes)</h2><p>Google needs you to click this yourself, one time.</p>' +
    '<a class="btn" target="_blank" href="' + esc(S.editorUrl) + '">Open the script editor ↗</a>' +
    '<ol class="big">' +
    '<li>In the new tab, click the blue <b>Deploy</b> button (top right), then <b>New deployment</b>.' + PIC.deploy + "</li>" +
    '<li>Click the gear ⚙ next to “Select type”, then <b>Web app</b>.' + PIC.type + "</li>" +
    '<li>Check <b>Execute as: Me</b> and <b>Who has access: Anyone</b>. Click <b>Deploy</b>.' + PIC.form + "</li>" +
    "<li>If Google asks, click <b>Authorize access</b> and <b>Allow</b>. Then click <b>Done</b> and come back to this tab.</li></ol>" +
    '<div class="waiting"><div class="spin"></div>Waiting for you to deploy… this panel moves on by itself.</div>' +
    '<button class="secondary" onclick="run(\'sidebarState\', undefined, this, \'Checking…\')">I did it — check now</button></div>' +
    '<details><summary>“Anyone” isn’t in the list</summary><p>Your school’s Google settings don’t allow it. Ask your tech office to let teachers share Apps Script web apps with “Anyone”. Students still sign in with Google, and only your roster gets in.</p></details>';
}

// While the teacher is deploying in the other tab, check every 5 seconds (only while this step is showing).
var POLL = null;
function poll() {
  var waiting = S && S.ready && !S.url && !working;
  if (waiting && !POLL) POLL = setInterval(function () {
    if (document.hidden) return;
    google.script.run.withSuccessHandler(function (s) { if (s.url) { S = s; clearInterval(POLL); POLL = null; render(); } }).sidebarState();
  }, 5000);
  if (!waiting && POLL) { clearInterval(POLL); POLL = null; }
}

function toggleQr(i) { openQr[i] = !openQr[i]; render(); }
function copyText(t, btn) {
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () {
    var old = btn.textContent; btn.textContent = "Copied ✓"; setTimeout(function () { btn.textContent = old; }, 2000);
  }, function () { prompt("Copy this link:", t); });
}
function createClass(btn) {
  var n = $("cname").value.trim();
  if (!n) { $("cname").focus(); $("cname").placeholder = "Type a class name first"; return; }
  var len = document.querySelector('input[name="len"]:checked');
  showAdd = false;
  run("sidebarCreateClass", { name: n, section: "", pathId: len ? len.value : "18-week" }, btn, "Creating…");
}
function save(btn) {
  run("sidebarSaveSettings", { domains: $("dom").value, teacherEmails: $("tch").value, adminEmails: $("adm").value, autoEnroll: $("auto").checked }, btn, "Saving…");
}
function update(btn) {
  busy(btn, "Checking…");
  google.script.run.withSuccessHandler(function (r) {
    if (r.ok) { $("upd").innerHTML = '<p><b>' + (r.same ? "You already have" : "Installed") + ' version ' + esc(r.version) + '.</b> Close and reopen this panel to see it.</p>'; btn.remove(); }
    else if (r.needsPaste) { $("upd").innerHTML = '<div class="warn">This copy needs the <a target="_blank" href="' + esc(r.pasteUrl) + '">one-time two-file loader</a>. After that it updates by itself.</div>'; btn.disabled = false; btn.textContent = btn.dataset.t; }
    else { $("upd").innerHTML = '<div class="warn">' + esc(r.error) + "</div>"; btn.disabled = false; btn.textContent = btn.dataset.t; }
  }).withFailureHandler(function (e) { $("upd").innerHTML = '<div class="warn">' + esc(e.message) + "</div>"; btn.disabled = false; btn.textContent = btn.dataset.t; }).sidebarUpdate();
}

function undo(btn) {
  if (!btn.dataset.sure) { btn.dataset.sure = "1"; btn.textContent = "Click again to confirm undo"; return; }
  busy(btn, "Undoing…");
  google.script.run.withSuccessHandler(function (r) {
    $("undo").innerHTML = r.ok ? '<p><b>Back to version ' + esc(r.version) + '.</b> Close and reopen this panel.</p>' : '<div class="warn">' + esc(r.error) + "</div>";
    if (r.ok) btn.remove(); else { btn.disabled = false; btn.textContent = btn.dataset.t; }
  }).withFailureHandler(function (e) { $("undo").innerHTML = '<div class="warn">' + esc(e.message) + "</div>"; btn.disabled = false; btn.textContent = btn.dataset.t; }).sidebarUndo();
}

// Opening the panel right after allowing permissions finishes setup with no more clicks.
google.script.run.withSuccessHandler(function (s) {
  S = s;
  if (!S.ready) setup(); else render();
}).withFailureHandler(function (e) { $("app").innerHTML = '<div class="warn">' + esc(e.message || String(e)) + "</div>"; }).sidebarState();
</script>
</body>
</html>
